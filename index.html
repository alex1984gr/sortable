<!DOCTYPE html>
<html>
<head>
    <link href="/style.css" rel="stylesheet">
    <title>From Hero to Zero</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <!-- Modal -->
    <div id="heroModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Battle Result</h2>
                <span class="modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <div id="modalMessage"></div>
                <div id="modalStats" class="modal-stats"></div>
            </div>
            <div class="modal-footer">
                <button id="modalButton" class="modal-btn">Continue</button>
            </div>
        </div>
    </div>

    <h1 id="title">This is the villain's hideout!</h1>

    <div id="searchbar-container">
        <textarea placeholder="Search for a hero, or click on one to battle them!" id="searchbar"></textarea>
        <div id="defeated-counter">Heroes defeated: 0</div>
        <button id="reset-hero-button">Reset Heroes</button>
        <div class="page-size-control">
            <label for="pageSize">Results per page:</label>
            <select id="pageSize" onchange="window.changePageSize(this.value)">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="-1">All</option>
            </select>
        </div>
        <div class="pagination-info" id="paginationInfo">
            Showing <span id="startRange">1</span> - <span id="endRange">20</span> of <span id="totalCount">0</span> heroes
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>
                        Icon
                        <button class="sort-btn" data-sort="icon"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Name
                        <button class="sort-btn" data-sort="name"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Full Name
                        <button class="sort-btn" data-sort="fullname"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Intelligence
                        <button class="sort-btn" data-sort="intelligence"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Strength
                        <button class="sort-btn" data-sort="strength"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Speed
                        <button class="sort-btn" data-sort="speed"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Durability
                        <button class="sort-btn" data-sort="durability"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Power
                        <button class="sort-btn" data-sort="power"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Combat
                        <button class="sort-btn" data-sort="combat"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Race
                        <button class="sort-btn" data-sort="race"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Gender
                        <button class="sort-btn" data-sort="gender"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Height
                        <button class="sort-btn" data-sort="height"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Weight
                        <button class="sort-btn" data-sort="weight"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Place of Birth
                        <button class="sort-btn" data-sort="placeofbirth"><i class="fas fa-sort"></i></button>
                    </th>
                    <th>
                        Alignment
                        <button class="sort-btn" data-sort="alignment"><i class="fas fa-sort"></i></button>
                    </th>
                </tr>
            </thead>
            <tbody id="heroTableBody">
                <!-- Data will be rendered here by JavaScript -->
                <tr>
                    <td colspan="10" class="loading">Loading heroes...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="paginationControls">
    </div>

    <!-- Load scripts in correct order -->
    <script src="cmd/api.js"></script>
    <script src="cmd/table.js"></script>
    <script src="cmd/battle.js"></script>
    <script src="cmd/app.js"></script>
</body>
</html>
